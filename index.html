:root {
  --bg: #e7ebee;
  --panel: #f6f7f8;
  --raise: #ffffff;
  --ink: #17202a;
  --ink-2: #4a5663;
  --ink-3: #7b8692;
  --line: #d2d8de;
  --line-2: #e3e7eb;
  --accent: #f2b705;
  --accent-ink: #1d1600;
  --accent-soft: #fcf0c8;
  --blue: #2c5d88;
  --blue-soft: #e3edf6;
  --ok: #2f7a4d;
  --mid: #a86d12;
  --bad: #b3261e;
  --bad-soft: #fbe7e5;
  --vp-bg: #e3e8ed;
  --vp-floor: #d7dde3;
  --vp-wall: #eef1f4;
  --vp-grid: #c1cad3;
  --draw-body: #ece9e2;
  --draw-facade: rgba(201, 166, 123, 0.28);
  --sheet-bg: #efe9dc;
  --sheet-part: #ffffff;
  --sheet-off: #e2dac8;
  --shadow: 0 1px 2px rgba(20, 30, 40, 0.06), 0 6px 20px rgba(20, 30, 40, 0.07);
  --font-ui: 'Barlow', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --font-cond: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 8px;
  --topbar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418; --panel: #161b20; --raise: #1d2329; --ink: #e4e9ee; --ink-2: #a8b3be; --ink-3: #75818d;
    --line: #2a323a; --line-2: #222930; --accent: #f2b705; --accent-ink: #1d1600; --accent-soft: #3a3113;
    --blue: #86b4de; --blue-soft: #1c2b39; --ok: #62c28a; --mid: #e0a24a; --bad: #f08a80; --bad-soft: #3a1c1a;
    --vp-bg: #181e24; --vp-floor: #20272e; --vp-wall: #252d35; --vp-grid: #34404b;
    --draw-body: #2a2f35; --draw-facade: rgba(201, 166, 123, 0.18);
    --sheet-bg: #2b2922; --sheet-part: #3a3d42; --sheet-off: #34312a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418; --panel: #161b20; --raise: #1d2329; --ink: #e4e9ee; --ink-2: #a8b3be; --ink-3: #75818d;
  --line: #2a323a; --line-2: #222930; --accent: #f2b705; --accent-ink: #1d1600; --accent-soft: #3a3113;
  --blue: #86b4de; --blue-soft: #1c2b39; --ok: #62c28a; --mid: #e0a24a; --bad: #f08a80; --bad-soft: #3a1c1a;
  --vp-bg: #181e24; --vp-floor: #20272e; --vp-wall: #252d35; --vp-grid: #34404b;
  --draw-body: #2a2f35; --draw-facade: rgba(201, 166, 123, 0.18);
  --sheet-bg: #2b2922; --sheet-part: #3a3d42; --sheet-off: #34312a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, label, summary, input, select { -webkit-tap-highlight-color: transparent; }
button, summary, .toggle { touch-action: manipulation; }
.viewport { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-cond); letter-spacing: 0.005em; margin: 0; text-wrap: balance; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.ico { display: inline-flex; width: 18px; height: 18px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.row-gap { display: flex; gap: 8px; align-items: center; }
.row-gap.wrap { flex-wrap: wrap; }
.eyebrow { font-family: var(--font-cond); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* Tugmalar */
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raise); font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-3); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--line-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; border: 0; background: transparent; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--line-2); color: var(--ink); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); margin-left: 6px; vertical-align: 2px; }

/* Yuqori panel */
#app { min-height: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; height: var(--topbar-h); padding: 0 12px 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); flex: none; }
.brand-mark { display: inline-flex; }
.brand-name { font-family: var(--font-cond); font-weight: 700; font-size: 19px; letter-spacing: 0.01em; }
.proj { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.proj-name { min-width: 0; flex: 0 1 340px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 8px; font-weight: 600; font-size: 15px; text-overflow: ellipsis; }
.proj-name:hover { border-color: var(--line); }
.proj-name:focus { border-color: var(--blue); background: var(--raise); outline: none; }
.save-state { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ok); white-space: nowrap; }
.save-state .ico { width: 16px; height: 16px; }
.save-state.muted { color: var(--ink-3); }
.save-state.bad { color: var(--bad); }
.top-actions { display: flex; gap: 2px; }

/* Bo'limlar */
.tabs { display: flex; gap: 2px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tab-btn { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 11px 14px 10px; font-family: var(--font-cond); font-weight: 600; font-size: 15px; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab-btn:hover { color: var(--ink); }
.tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* 3D maydon */
.viewport { position: relative; background: var(--vp-bg); overflow: hidden; touch-action: none; }
.viewport canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.vp-bar { position: absolute; z-index: 3; display: flex; gap: 6px; padding: 10px; pointer-events: none; }
.vp-bar > * { pointer-events: auto; }
.vp-views { top: 0; left: 0; }
.vp-toggles { top: 0; right: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--raise); background: color-mix(in srgb, var(--raise) 88%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-size: 13px; font-weight: 600; color: var(--ink-2); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.chip-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.chip-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip-btn .ico { width: 17px; height: 17px; }
.chip-btn.only { padding: 0 9px; }
@media (min-width: 900px) and (max-width: 1180px) { .vp-toggles .chip-btn .lbl { display: none; } }
.vp-stats { position: absolute; z-index: 3; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 7px 8px 7px 12px; border-radius: 9px; background: var(--raise); background: color-mix(in srgb, var(--raise) 90%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); max-width: calc(100% - 20px); }
.vp-stats b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; }
.stat-total { border: 0; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 4px 9px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.stat-warn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 3px 8px; font-weight: 600; font-size: 12.5px; }
.stat-warn .ico { width: 15px; height: 15px; }
.vp-info { position: absolute; z-index: 4; right: 10px; bottom: 10px; width: 260px; max-width: calc(100% - 20px); background: var(--raise); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 9px; padding: 8px 10px 10px 12px; box-shadow: var(--shadow); font-size: 13px; }
.info-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-family: var(--font-cond); font-size: 16px; }
.info-head .icon-btn { width: 28px; height: 28px; }
.info-dims { font-family: var(--font-mono); font-size: 15px; margin: 2px 0 6px; }
.info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; border-top: 1px solid var(--line-2); }
.drawing-wrap { position: absolute; inset: 0; z-index: 2; background: var(--raise); display: flex; flex-direction: column; padding: 56px 16px 60px; }
.drawing-head { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 6px; }
.drawing-head .btn { margin-left: auto; }
.drawing-svg { flex: 1; min-height: 0; display: flex; }
.drawing-svg svg { width: 100%; height: 100%; }
.gl-error { position: absolute; inset: 40% 16px auto; text-align: center; color: var(--ink-2); }

/* Chizma ranglari */
.d-body { fill: var(--draw-body); stroke: var(--ink); }
.d-back { fill: var(--panel); stroke: var(--ink-3); }
.d-top { fill: var(--line); stroke: var(--ink); }
.d-facade { fill: var(--draw-facade); stroke: var(--ink); }
.d-kupe { fill: var(--blue-soft); fill: color-mix(in srgb, var(--blue) 12%, transparent); stroke: var(--ink); }
.d-swing { fill: none; stroke: var(--ink-3); stroke-dasharray: 14 10; }
.d-handle { fill: var(--ink-3); stroke: none; }
.d-leg { fill: var(--ink-2); stroke: none; }
.d-rod { stroke: var(--ink-3); }
.d-drawer { fill: none; stroke: var(--ink-3); stroke-dasharray: 8 6; }
.dim, .dim-ext { stroke: var(--blue); fill: none; }
.dim-arrow { fill: var(--blue); }
.dim-t { fill: var(--blue); font-family: var(--font-mono); }
.dim-in { stroke: var(--ink-3); }
.dim-in-t { fill: var(--ink-3); }
.hatch-line { stroke: var(--line); }
svg.thumb .d-body, svg.thumb .d-facade, svg.thumb .d-top, svg.thumb .d-kupe { stroke: var(--ink-2); }

/* Yon panel (inspektor) */
.side { background: var(--panel); }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
.side-head h2 { font-size: 18px; }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--line-2); font-family: var(--font-mono); font-size: 12px; vertical-align: 2px; }
.mod-list { list-style: none; margin: 0; padding: 0 10px 8px; display: grid; gap: 3px; }
.mod-item { display: flex; align-items: center; gap: 2px; border-radius: 8px; border: 1px solid transparent; padding-right: 4px; }
.mod-item:hover { background: var(--line-2); }
.mod-item.sel { background: var(--raise); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent); }
.mod-main { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; border: 0; background: none; padding: 8px 6px 8px 10px; text-align: left; }
.mod-no { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--line-2); font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); flex: none; }
.mod-item.sel .mod-no { background: var(--accent); color: var(--accent-ink); }
.mod-text { display: flex; flex-direction: column; min-width: 0; }
.mod-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod-dims { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.mod-acts { display: flex; align-items: center; }
.empty { margin: 4px 16px 16px; padding: 16px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 12px; justify-items: start; color: var(--ink-2); }
.empty p { margin: 0; }
.empty-note { color: var(--ink-3); padding: 12px 16px; margin: 0; }

#editor { padding: 4px 0 24px; border-top: 1px solid var(--line); }
.editor-head { padding: 14px 16px 6px; }
.editor-head h3 { font-size: 21px; }
.grp { border-bottom: 1px solid var(--line-2); }
.grp summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-family: var(--font-cond); font-weight: 600; font-size: 16px; }
.grp summary::-webkit-details-marker { display: none; }
.grp summary::after { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
.grp[open] summary::after { transform: rotate(-135deg); }
.grp-body { padding: 0 16px 16px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .flabel { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field input[type=text], .field select, .mat-name, .mini-card input[type=text] { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raise); }
.field input:focus, .field select:focus, .mat-name:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
.stepper { display: flex; align-items: stretch; height: 38px; border: 1px solid var(--line); border-radius: 7px; background: var(--raise); overflow: hidden; min-width: 0; }
.stepper:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.stepper input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; text-align: center; font-family: var(--font-mono); font-size: 14px; padding: 0 2px; -moz-appearance: textfield; appearance: textfield; }
.stepper input:focus { outline: none; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field .unit { font-weight: 400; color: var(--ink-3); }
.st-btn { flex: none; width: 30px; border: 0; background: transparent; color: var(--ink-3); display: grid; place-items: center; }
.st-btn:hover:not(:disabled) { background: var(--line-2); color: var(--ink); }
.st-btn:disabled { opacity: .35; cursor: default; }
.st-btn .ico { width: 15px; height: 15px; }
.stepper.compact { width: auto; }
.st-val { min-width: 34px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 14px; }
.seg { display: flex; padding: 3px; gap: 3px; background: var(--line-2); border-radius: 8px; }
.seg button { flex: 1; min-width: 0; height: 32px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tg-track { width: 38px; height: 22px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.tg-dot { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--raise); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + .tg-track { background: var(--accent); }
.toggle input:checked + .tg-track .tg-dot { transform: translateX(16px); }
.toggle input:focus-visible + .tg-track { outline: 2px solid var(--blue); outline-offset: 2px; }
.tg-text { display: flex; flex-direction: column; }
.tg-text small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.sec-bar { display: flex; align-items: center; justify-content: space-between; }
.sec-strip { display: flex; gap: 3px; height: 26px; }
.sec-strip span { display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); border-radius: 4px; font-family: var(--font-mono); font-size: 11px; min-width: 14px; }
.sec-card { border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); padding: 10px 12px 12px; display: grid; gap: 10px; }
.sec-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.sec-head .icon-btn { margin-left: auto; width: 30px; height: 30px; }
.sec-no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); font-family: var(--font-mono); font-size: 12px; }

/* Sahifalar */
.page-inner { max-width: 1180px; margin: 0 auto; padding-block: 22px 40px; padding-inline: 20px; display: grid; gap: 20px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; line-height: 1.1; }
.page-head p { margin: 4px 0 0; max-width: 64ch; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 2px; }
.kpi-l { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.kpi-v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.kpi-v small { font-family: var(--font-ui); font-size: 13px; color: var(--ink-3); }
.toolbar { display: flex; gap: 12px; align-items: end; }
.toolbar .field { width: min(320px, 100%); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
.tbl th.num { text-align: right; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.tbl td.no { font-family: var(--font-mono); color: var(--ink-3); font-size: 12.5px; width: 1%; }
.tbl td.qty { font-weight: 600; color: var(--ink); }
.tbl td.cut { color: var(--blue); }
.cell-name { font-weight: 600; }
.cell-sub { font-size: 12px; color: var(--ink-3); }
.cell-mat { white-space: nowrap; font-size: 13px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); margin-right: 6px; vertical-align: -1px; }
.swatch.big { width: 16px; height: 16px; vertical-align: -2px; margin-right: 8px; }
.edge-glyph { display: inline-flex; vertical-align: middle; }
.edge-glyph .e-body { fill: var(--line-2); stroke: none; }
.edge-glyph line { stroke-linecap: round; }
.edge-glyph .e-none { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 2; }
.edge-glyph .e-thin { stroke: var(--ink-2); stroke-width: 1.4; }
.edge-glyph .e-mid { stroke: var(--blue); stroke-width: 2.6; }
.edge-glyph .e-thick { stroke: var(--accent); stroke-width: 4; }
.legend { display: flex; align-items: center; gap: 8px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two-col h2, .cost-sec h2 { font-size: 19px; margin-bottom: 8px; }

/* Raskroy */
.nest-block { display: grid; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.nest-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 20px; flex-wrap: wrap; }
.nest-head h2 { font-size: 21px; display: flex; align-items: center; }
.nest-head p { margin: 2px 0 0; }
.nest-kpi { display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; }
.big-num { font-family: var(--font-mono); font-size: 28px; font-weight: 500; line-height: 1; }
.util { font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; }
.util.good { background: var(--line-2); background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.util.mid { background: var(--line-2); background: color-mix(in srgb, var(--mid) 16%, transparent); color: var(--mid); }
.util.low { background: var(--bad-soft); color: var(--bad); }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.sheet { margin: 0; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.sheet-img svg { width: 100%; height: auto; display: block; }
.sheet figcaption { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.sh-bg { fill: var(--sheet-bg); stroke: var(--ink-2); stroke-width: 4; }
.sh-off { fill: var(--sheet-off); stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 14 10; }
.sh-off-t { fill: var(--ink-3); font-family: var(--font-mono); }
.sh-part { fill: var(--sheet-part); stroke: var(--ink); stroke-width: 3; }
.sh-t { fill: var(--ink); font-family: var(--font-mono); }
.sh-no { font-weight: 700; fill: var(--blue); }
.warn-line { display: flex; align-items: center; gap: 8px; color: var(--bad); background: var(--bad-soft); padding: 8px 12px; border-radius: var(--r); margin: 0; font-size: 14px; }

/* Smeta */
.total-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px 32px; align-items: center; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); }
.total-num { font-family: var(--font-mono); font-size: clamp(30px, 5vw, 46px); font-weight: 500; line-height: 1.1; margin-top: 6px; letter-spacing: -0.02em; }
.total-num small { font-family: var(--font-ui); font-size: 18px; color: var(--ink-3); letter-spacing: 0; }
.total-split { display: grid; gap: 7px; }
.split-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.split-l { color: var(--ink-2); }
.split-bar { height: 8px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.split-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.split-v { font-family: var(--font-mono); font-size: 12.5px; min-width: 96px; }
.cost-params { max-width: 520px; }
.cost-sec { display: grid; gap: 4px; }
.cost-sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.strong { font-family: var(--font-mono); font-weight: 500; }
.cost-final { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 16px; }
.cf-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.cf-row:last-child { border-bottom: 0; }
.cf-row .num { font-family: var(--font-mono); }
.cf-row.total { font-family: var(--font-cond); font-size: 20px; font-weight: 700; }
.cf-row.total .num { font-size: 19px; }

/* Sozlamalar */
.set-sec { display: grid; gap: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 18px; }
.set-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.set-head h2 { font-size: 19px; }
.mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.mat-card { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; display: grid; gap: 10px; background: var(--panel); }
.mat-top { display: flex; align-items: center; gap: 8px; }
.mat-top input[type=color] { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 7px; padding: 2px; background: var(--raise); flex: none; }
.mat-name { font-weight: 600; }
.grid-mat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; align-items: end; }
.grid-mat .toggle { grid-column: 1 / -1; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.mini-card { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; background: var(--panel); }
.mini-title { font-weight: 600; font-size: 14px; }

/* Modallar */
.backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(12, 16, 20, 0.45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column; background: var(--panel); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
.modal.wide { width: min(900px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 10px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 21px; }
.modal-body { padding: 16px 20px 20px; overflow-y: auto; display: grid; gap: 12px; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tpl { display: grid; gap: 4px; text-align: left; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); }
.tpl:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tpl-img { display: grid; place-items: center; height: 110px; background: var(--vp-bg); border-radius: 6px; padding: 6px; }
.tpl-img svg { width: 100%; height: 100%; }
.tpl-name { font-family: var(--font-cond); font-weight: 700; font-size: 16px; }
.tpl-desc { font-size: 12px; color: var(--ink-3); }
.proj-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.proj-item { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--raise); padding-right: 6px; }
.proj-item.cur { border-color: var(--accent); }
.proj-open { flex: 1; min-width: 0; display: grid; gap: 1px; text-align: left; border: 0; background: none; padding: 10px 12px; }
.proj-n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exp-list { display: grid; gap: 6px; }
.exp-item { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); padding: 12px 14px; }
.exp-item:hover { border-color: var(--accent); }
.exp-item .ico { width: 22px; height: 22px; color: var(--ink-2); }
.exp-item span { display: grid; }
.exp-item small { color: var(--ink-3); font-size: 12.5px; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 200; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Kompyuter ── */
@media (min-width: 900px) {
  html, body { height: 100%; }
  body { overflow: hidden; }
  #app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
  main { min-height: 0; position: relative; }
  .pane { height: 100%; }
  .pane.design { display: grid; grid-template-columns: minmax(340px, 390px) minmax(0, 1fr); }
  .pane.design .side { order: -1; overflow-y: auto; border-right: 1px solid var(--line); }
  .pane.page { overflow-y: auto; }
  .viewport { height: 100%; }
}

/* ── Telefon / planshet ── */
@media (max-width: 899px) {
  body { font-size: 15px; }
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; gap: 6px; padding: 0 6px 0 10px; }
  .brand-name { display: none; }
  .proj-name { flex: 1 1 auto; padding: 6px 4px; }
  .save-state .lbl, .top-actions .lbl { display: none; }
  .top-actions .btn { padding: 0 9px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0 4px env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--line); border-bottom: 0; justify-content: space-around; }
  .tab-btn { flex: 1; flex-direction: column; gap: 2px; padding: 8px 2px 7px; font-size: 12px; border-bottom: 0; border-top: 3px solid transparent; margin: -1px 0 0; min-width: 0; }
  .tab-btn .ico { width: 21px; height: 21px; }
  .tab-btn[aria-selected="true"] { border-top-color: var(--accent); }
  main { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .viewport { position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); height: 46vh; height: 46svh; z-index: 20; border-bottom: 1px solid var(--line); }
  .vp-bar { padding: 8px; gap: 5px; }
  .vp-views { right: 0; overflow-x: auto; scrollbar-width: none; }
  .vp-toggles { top: auto; bottom: 46px; right: 0; left: 0; max-width: none; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
  .vp-toggles .chip-btn .lbl { display: none; }
  .chip-btn { height: 32px; padding: 0 10px; flex: none; }
  .vp-stats { left: 8px; bottom: 8px; gap: 4px 10px; font-size: 12px; padding: 5px 6px 5px 10px; }
  .vp-info { top: 48px; bottom: auto; right: 8px; width: 230px; }
  .drawing-wrap { padding: 52px 12px 50px; }
  .side { background: var(--bg); }
  .page-inner { padding-inline: 16px; padding-block: 16px 30px; gap: 16px; }
  .page-head h1 { font-size: 25px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two-col { grid-template-columns: 1fr; }
  .total-card { grid-template-columns: 1fr; padding: 16px; }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .backdrop { align-items: end; padding: 0; }
  .modal, .modal.wide { width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tbl { font-size: 13px; }
  .tbl td, .tbl th { padding: 7px 8px; }
}
@media (max-width: 380px) {
  .grid3, .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}


/* ── iPhone / sensorli ekranlar ── */
@media (pointer: coarse) {
  input, select, textarea, .proj-name, .stepper input { font-size: 16px !important; }
}
.topbar { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.standalone-doc .topbar { padding-top: env(safe-area-inset-top, 0px); height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); }
@media (max-width: 899px) {
  .topbar { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .standalone-doc .topbar { top: 0; }
  .tabs { padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
}
/* Telefon yotiq holatda: inspektor chapda, 3D o'ngda */
@media (max-width: 899px) and (orientation: landscape) and (max-height: 540px) {
  .pane.design { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); align-items: start; }
  .pane.design .side { order: -1; min-width: 0; padding-left: env(safe-area-inset-left, 0px); }
  .viewport { height: calc(100vh - var(--topbar-h) - 50px); height: calc(100svh - var(--topbar-h) - 50px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border-bottom: 0; border-left: 1px solid var(--line); }
  .tab-btn { flex-direction: row; gap: 6px; padding: 7px 4px 6px; }
  .tab-btn .ico { width: 19px; height: 19px; }
  main { padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px)); }
  .page-inner { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
}
.install-tip { position: fixed; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; gap: 12px; align-items: flex-start; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 8px 12px 14px; box-shadow: var(--shadow); font-size: 14px; line-height: 1.4; max-width: 520px; margin: 0 auto; }
.install-tip strong { display: block; font-family: var(--font-cond); font-size: 16px; margin-bottom: 2px; }
.install-tip .ico { width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }
.install-tip .icon-btn { color: inherit; margin-left: auto; opacity: .75; }
.share-glyph { display: inline-flex; width: 16px; height: 16px; vertical-align: -3px; color: var(--accent); }

/* Chop etish (faqat oflayn faylda) */
@media print {
  .topbar, .tabs, .viewport, .side, .btn, .toolbar, #modalRoot, .toast { display: none !important; }
  body { overflow: visible; background: #fff; color: #000; }
  #app, main, .pane { display: block !important; height: auto !important; overflow: visible !important; }
  .pane[hidden] { display: none !important; }
  .table-wrap { overflow: visible; border: 0; }
}
